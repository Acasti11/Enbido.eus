spring.application.name=backend
# JWT
jwt.secret=tu-clave-super-secreta-de-al-menos-32-caracteres-para-mus!!
jwt.expiration=900000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# Primary DataSource (Escritura/Lectura)
spring.datasource.primary.jdbc-url=jdbc:mysql://db:3306/mudb
spring.datasource.primary.username=muuser
spring.datasource.primary.password=mupass
spring.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.primary.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.primary.hikari.maximum-pool-size=10
spring.datasource.primary.hikari.minimum-idle=5

# Replica DataSource (Solo Lectura)
spring.datasource.replica.jdbc-url=jdbc:mysql://db-replica:3306/mudb
spring.datasource.replica.username=muuser_read
spring.datasource.replica.password=mureadpass
spring.datasource.replica.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.replica.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.replica.hikari.maximum-pool-size=10
spring.datasource.replica.hikari.minimum-idle=5

# CONFIGURACIÓN SMTP DE CORREO REAL (JAKARTA MAIL)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.from=${SPRING_MAIL_FROM:noreply@enbido.eus}