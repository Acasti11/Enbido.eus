spring.application.name=backend

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS (comand-separated list of allowed origins)
# Production: cors.allowed-origins=https://enbido.eus,https://www.enbido.eus
# Development: cors.allowed-origins=http://localhost:5173
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://enbido.eus,https://www.enbido.eus}
# CORS - Desarrollo local cors.allowed-origins=http://localhost:8081

# JWT Cookie - Desactivar Secure para HTTP local
jwt.cookie.secure=true
jwt.cookie.same-site=Strict  # Lax funciona en dev, Strict en prod
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Primary DataSource (Escritura/Lectura)
spring.datasource.primary.url=jdbc:mysql://db:3306/mudb
spring.datasource.primary.username=${DB_PRIMARY_USER}
spring.datasource.primary.password=${DB_PRIMARY_PASS}
spring.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.primary.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.primary.hikari.maximum-pool-size=10
spring.datasource.primary.hikari.minimum-idle=5

# Replica DataSource (Solo Lectura)
spring.datasource.replica.url=jdbc:mysql://db-replica:3306/mudb
spring.datasource.replica.username=${DB_REPLICA_USER}
spring.datasource.replica.password=${DB_REPLICA_PASS}
spring.datasource.replica.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.replica.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.replica.hikari.maximum-pool-size=10
spring.datasource.replica.hikari.minimum-idle=5

# Google OAuth
GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:}

# SMTP
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.from=${SPRING_MAIL_FROM:noreply@enbido.eus}